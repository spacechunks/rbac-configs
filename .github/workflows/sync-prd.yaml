name: sync-prd
on:
  push:
    branches:
      - frg/test
jobs:
  sync:
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27
      - name: sync prd
        run: |
          ./scripts/sync.sh ../configs/prd
